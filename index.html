  <!-- Dynamic Client-Side Component Loader -->
  <script>
    async function loadComponent(placeholderId, url) {
      try {
        const cacheBustUrl = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
        const response = await fetch(cacheBustUrl);
        if (response.ok) {
          const html = await response.text();
          const placeholder = document.getElementById(placeholderId);
          if (placeholder) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html.trim();
            const newElement = tempDiv.firstElementChild;
            
            // Execute scripts inside dynamically loaded modular components
            const scripts = newElement.querySelectorAll('script');
            scripts.forEach(oldScript => {
              const newScript = document.createElement('script');
              newScript.textContent = oldScript.textContent;
              Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
              oldScript.parentNode.replaceChild(newScript, oldScript);
            });
            
            placeholder.replaceWith(newElement);
          }
        } else {
          console.error("Failed to load component " + url + ": " + response.statusText);
        }
      } catch (err) {
        console.error("Error loading component " + url + ":", err);
      }
    }
    document.addEventListener("DOMContentLoaded", () => {
      console.log("Loading modular HTML components...");
      Promise.all([
        loadComponent("header-placeholder", "components/header.html"),
        loadComponent("hero-placeholder", "components/hero.html"),
        loadComponent("services-placeholder", "components/services.html"),
        loadComponent("product-placeholder", "components/product.html"),
        loadComponent("contact-placeholder", "components/contact.html"),
        loadComponent("faq-placeholder", "components/faq.html"),
        loadComponent("footer-placeholder", "components/footer.html")
      ]).then(() => {
        console.log("All components loaded successfully! Triggering SPA router...");
        document.dispatchEvent(new Event("ComponentsLoaded"));
      });
    });
  </script>
  <script>
        document.addEventListener("ComponentsLoaded", () => {
          // Elements that make up the "Home" landing page
          const homeElements = [
            document.getElementById("hero"),
            document.getElementById("solutions"),
            document.getElementById("ai"),
            
          ].filter(Boolean);
          // SPA specific pages
          const productsSection = document.getElementById("products");
          const contactSection = document.getElementById("contact");
          const faqSection = document.getElementById("faq");
          const solutionsSection = document.getElementById("solutions"); // already exists
          // SPA Navigation Handler
          const navigateTo = (hash) => {
            // Reset scrolling
            window.scrollTo({ top: 0, behavior: "smooth" });
            // Fade transition effect
            const fadeTransition = (showCallback) => {
              document.body.style.opacity = 0;
              setTimeout(() => {
                showCallback();
                document.body.style.opacity = 1;
              }, 150);
            };
            // Helper to swap the solutions banner image
            const solutionsBannerImg = solutionsSection ? solutionsSection.querySelector('.pointer-events-none.absolute.inset-0 img') : null;
            const setBannerForSolutions = () => { if (solutionsBannerImg) solutionsBannerImg.src = 'backgrounds/sprinkle-solutions.svg'; };
            const setBannerForHome = () => { if (solutionsBannerImg) solutionsBannerImg.src = 'backgrounds/lab.png'; };
            fadeTransition(() => {
              if (hash === "#solutions" || hash === "#products" || hash === "#contact" || hash === "#faq") {
                document.body.classList.add("spa-active");
              } else {
                document.body.classList.remove("spa-active");
              }
              if (hash === "#solutions") {
                // Show ONLY solutions — use sprinkle banner
                setBannerForSolutions();
                homeElements.forEach(el => {
                  if (el === solutionsSection) {
                    el.classList.remove("spa-hidden");
                  } else {
                    el.classList.add("spa-hidden");
                  }
                });
                productsSection.classList.add("spa-hidden");
                contactSection.classList.add("spa-hidden");
                faqSection.classList.add("spa-hidden");
                
                // Show the testimonials on Solutions page
                const testimonialsEl = document.getElementById("solutions-testimonials-section");
                if (testimonialsEl) testimonialsEl.classList.remove("spa-hidden");
              } else if (hash === "#products") {
                // Show ONLY products
                homeElements.forEach(el => el.classList.add("spa-hidden"));
                productsSection.classList.remove("spa-hidden");
                contactSection.classList.add("spa-hidden");
                faqSection.classList.add("spa-hidden");
              } else if (hash === "#contact") {
                // Show ONLY contact
                homeElements.forEach(el => el.classList.add("spa-hidden"));
                productsSection.classList.add("spa-hidden");
                contactSection.classList.remove("spa-hidden");
                faqSection.classList.add("spa-hidden");
              } else if (hash === "#faq") {
                // Show ONLY faq
                homeElements.forEach(el => el.classList.add("spa-hidden"));
                productsSection.classList.add("spa-hidden");
                contactSection.classList.add("spa-hidden");
                faqSection.classList.remove("spa-hidden");
              } else {
                // Home (empty hash or unrecognized) — restore lab.png banner
                setBannerForHome();
                homeElements.forEach(el => el.classList.remove("spa-hidden"));
                productsSection.classList.add("spa-hidden");
                contactSection.classList.add("spa-hidden");
                faqSection.classList.add("spa-hidden");
                
                // Hide the testimonials on landing page
                const testimonialsEl = document.getElementById("solutions-testimonials-section");
                if (testimonialsEl) testimonialsEl.classList.add("spa-hidden");
              }
            });
            // Update active class on nav links
            document.querySelectorAll('a[href^="#"], a[href^="/"]').forEach(link => {
              const href = link.getAttribute("href");
              if (href === hash || (hash === "" && href === "index.html")) {
                link.classList.add("border-white");
                link.style.borderColor = "white";
              } else {
                link.classList.remove("border-white");
              }
            });
          };
          // Listen to clicks on navigation links
          document.body.addEventListener("click", (e) => {
            const anchor = e.target.closest("a");
            if (!anchor) return;
            const href = anchor.getAttribute("href");
            if (!href) return;
            // Support logo returning to home
            if (href === "index.html" || href === "/" || href === "") {
              e.preventDefault();
              history.pushState(null, "", "index.html");
              navigateTo("");
              return;
            }
            // Support hash-driven SPA pages
            if (href.startsWith("#") || href.startsWith("/contact") || href.startsWith("/solutions") || href.startsWith("/industries") || href.startsWith("/faq")) {
              e.preventDefault();
              let targetHash = href;
              if (href === "/contact") targetHash = "#contact";
              if (href === "/solutions") targetHash = "#solutions";
              if (href === "/industries") targetHash = "#products";
              if (href === "/faq") targetHash = "#faq";
              history.pushState(null, "", targetHash);
              navigateTo(targetHash);
            }
          });
          // Handle back/forward and hash changes
          window.addEventListener("popstate", () => navigateTo(window.location.hash));
          window.addEventListener("hashchange", () => navigateTo(window.location.hash));
          // Handle initial load
          if (window.location.hash) {
            navigateTo(window.location.hash);
          }
        });
      </script>
