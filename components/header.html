  <style>
    /* Premium Shrinking Header overrides */
    header {
      background-color: transparent !important;
      border-top: none !important;
      border-bottom: none !important;
      box-shadow: none !important;
      top: -1px !important;
      /* Cover 1px sub-pixel gap at the very top of Chrome viewport */
      padding-top: 1px !important;
      /* Offset the -1px top placement */
      transition: background-color 0.3s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    header .header-inner {
      height: 4rem !important;
      /* Original height (64px) */
      transition: height 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    /* Scrolled state: opaque solid black with absolutely NO bottom border line */
    header.header-scrolled {
      background-color: #000000 !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6) !important;
      border-bottom: none !important;
    }

    header.header-scrolled .header-inner {
      height: 3.25rem !important;
      /* Elegant compact height of 52px */
    }
  </style>

  <script>
    (() => {
      const header = document.querySelector('header');
      if (!header) return;

      const handleScroll = () => {
        if (window.scrollY > 20) {
          header.classList.add('header-scrolled');
        } else {
          header.classList.remove('header-scrolled');
        }
      };

      window.addEventListener('scroll', handleScroll, { passive: true });
      // Run once on load to ensure correct state
      handleScroll();
    })();
  </script>
</header>
