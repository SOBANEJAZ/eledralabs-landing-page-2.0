<section id="contact" class="spa-section spa-hidden border border-border flex flex-col mb-5 md:mb-8 lg:mb-17.5 scroll-mt-17">
    <style>
      /* Premium contact form layout and spacing overrides */
      #contact form .grid > div {
        padding: 8px 0 !important;
      }
      
      #contact form {
        display: flex !important;
        flex-direction: column !important;
        gap: 22px !important;
      }
      
      #contact form .grid {
        display: grid !important;
        grid-template-cols: 1fr !important;
        gap: 22px 28px !important;
      }
      
      @media (min-width: 768px) {
        #contact form .grid {
          grid-template-cols: 1fr 1fr !important;
        }
      }
      
      #contact form .flex.flex-col {
        padding: 0 !important;
        gap: 8px !important;
      }
      
      #contact form button[type="submit"] {
        margin-top: 12px !important;
      }
    </style>
        <!-- Grand Symmetrical Header (Matches Product Page Exactly) -->
        <div class="h-80 border-b border-border flex flex-col gap-8 px-5 py-5 relative overflow-hidden">
          <div class="pointer-events-none absolute inset-0 bg-surface mix-blend-screen" aria-hidden="true">
            <img alt="" decoding="async" class="object-cover object-center" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent" src="backgrounds/sprinkle-contact.svg" />
          </div>
          <div class="pointer-events-none absolute inset-x-0 top-0 h-87.5 bg-linear-to-b from-surface to-transparent"></div>
          <p class="relative z-10 font-sans text-7 leading-120">
            <span class="text-white">Contact Us.</span>
            <span class="text-white/50">Connect with Eledra Labs' systems automation experts to custom-engineer your AI stacks.</span>
          </p>
        </div>
        
        <!-- Spacious Premium Form Area -->
        <div class="p-8 bg-surface-card border-b border-border flex flex-col justify-center gap-8 font-sans">
          <form class="flex flex-col gap-2.5 max-w-200 mx-auto w-full" onsubmit="event.preventDefault(); alert('Thank you! Eledra Labs team will contact you shortly.');">
            <!-- Row 1: Name and Email -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-2.5">
              <div class="flex flex-col gap-1">
                <label class="text-xs uppercase font-favorit tracking-wider text-white/50">Full Name</label>
                <input required type="text" placeholder="Alex Carter" class="bg-black/40 border border-white/10 rounded-none px-4 py-3 text-sm text-white focus:outline-none focus:border-white/40 transition-colors" />
              </div>
              <div class="flex flex-col gap-1">
                <label class="text-xs uppercase font-favorit tracking-wider text-white/50">Email Address</label>
                <input required type="email" placeholder="alex@company.com" class="bg-black/40 border border-white/10 rounded-none px-4 py-3 text-sm text-white focus:outline-none focus:border-white/40 transition-colors" />
              </div>
            </div>
            
            <!-- Row 2: Phone and Organization -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-2.5">
              <div class="flex flex-col gap-1">
                <label class="text-xs uppercase font-favorit tracking-wider text-white/50">Phone Number</label>
                <input required type="tel" placeholder="+1 (555) 019-2834" class="bg-black/40 border border-white/10 rounded-none px-4 py-3 text-sm text-white focus:outline-none focus:border-white/40 transition-colors" />
              </div>
              <div class="flex flex-col gap-1">
                <label class="text-xs uppercase font-favorit tracking-wider text-white/50">Organization</label>
                <input required type="text" placeholder="Eledra Labs Inc." class="bg-black/40 border border-white/10 rounded-none px-4 py-3 text-sm text-white focus:outline-none focus:border-white/40 transition-colors" />
              </div>
            </div>

            <!-- Row 3: Project Type and Budget Range -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-2.5">
              <div class="flex flex-col gap-1">
                <label class="text-xs uppercase font-favorit tracking-wider text-white/50">Area of Interest</label>
                <select required class="bg-black/40 border border-white/10 rounded-none px-4 py-3 text-sm text-white focus:outline-none focus:border-white/40 transition-colors appearance-none cursor-pointer" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27 fill=%27none%27 viewBox=%270 0 12 12%27><path stroke=%27rgba(255,255,255,0.5)%27 stroke-width=%271.2%27 stroke-linecap=%27square%27 d=%27M3 4.5l3 3 3-3%27/></svg>'); background-repeat: no-repeat; background-position: right 16px center; padding-right: 40px;">
                  <option value="" disabled selected hidden>Select project type...</option>
                  <option value="workflow">AI Workflow Automation</option>
                  <option value="voice">Conversational Voice Agents</option>
                  <option value="chatbots">Custom LLM Chatbots</option>
                  <option value="compute">GPU Compute Orchestration</option>
                  <option value="rl">Reinforcement Learning Stack</option>
                  <option value="custom">Other Custom Architectures</option>
                </select>
              </div>
              <div class="flex flex-col gap-1">
                <label class="text-xs uppercase font-favorit tracking-wider text-white/50">Estimated Budget Range</label>
                <select required class="bg-black/40 border border-white/10 rounded-none px-4 py-3 text-sm text-white focus:outline-none focus:border-white/40 transition-colors appearance-none cursor-pointer" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27 fill=%27none%27 viewBox=%270 0 12 12%27><path stroke=%27rgba(255,255,255,0.5)%27 stroke-width=%271.2%27 stroke-linecap=%27square%27 d=%27M3 4.5l3 3 3-3%27/></svg>'); background-repeat: no-repeat; background-position: right 16px center; padding-right: 40px;">
                  <option value="" disabled selected hidden>Select budget range...</option>
                  <option value="exploratory">Exploratory / Not Sure</option>
                  <option value="under-10k">Under $10,000 / month</option>
                  <option value="10k-30k">$10,000 - $30,000 / month</option>
                  <option value="30k-100k">$30,000 - $100,000 / month</option>
                  <option value="enterprise">$100,000+ / month (Enterprise)</option>
                </select>
              </div>
            </div>
            
            <!-- Row 4: Detailed Requirements -->
            <div class="flex flex-col gap-1">
              <label class="text-xs uppercase font-favorit tracking-wider text-white/50">Detailed Project Scope &amp; Custom Requirements</label>
              <textarea placeholder="Tell us about your systems automation goals, custom integration pipelines, or specific compute needs..." rows="4" class="bg-black/40 border border-white/10 rounded-none px-4 py-3 text-sm text-white focus:outline-none focus:border-white/40 transition-colors resize-none"></textarea>
            </div>
            
            <!-- Spacious Submit Button -->
            <button type="submit" class="group inline-flex w-fit shrink-0 items-center justify-center gap-1 whitespace-nowrap font-favorit uppercase transition-colors hover:cursor-pointer bg-white text-black min-h-10 px-5 py-3 text-xs leading-none self-start mt-4">
              Submit Message
              <div class="w-3 h-3 overflow-hidden relative ml-1">
                <div class="flex -translate-x-full transition-transform duration-300 ease-in-out group-hover:translate-x-0">
                  <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 shrink-0">
                    <path d="M4.75 9.125L7.875 6L4.75 2.875" stroke="currentColor" stroke-linecap="square"></path>
                  </svg>
                  <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 shrink-0">
                    <path d="M4.75 9.125L7.875 6L4.75 2.875" stroke="currentColor" stroke-linecap="square"></path>
                  </svg>
                </div>
              </div>
            </button>
          </form>
        </div>

        </section>
